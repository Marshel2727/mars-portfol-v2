name: Code checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back_end/requirements.txt
      - run: python -m pip install -r back_end/requirements.txt
      - run: python -m unittest discover -s back_end/tests -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front_end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front_end/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
